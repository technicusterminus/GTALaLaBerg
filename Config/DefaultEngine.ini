[/Script/Engine.RendererSettings]
; Claude: die ganze Stadt entsteht als ProceduralMesh zur Laufzeit. Solche
; Komponenten liefern keine Mesh-Distanzfelder, also hat Lumen nichts zum
; Verfolgen und meldet das als Fehler. Bildschirmraum-Verfahren kommen ohne
; Vorberechnung aus und passen zu dieser Geometrie.
r.DynamicGlobalIlluminationMethod=2
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=False
; Virtuelle Schattenkarten. Solange die Stadt als ProceduralMesh entstand,
; legten sie die ganze Szene in den Schatten und waren deshalb aus. Seit die
; Stadt aus Nanite-Assets kommt, stimmt das Licht damit wieder - und die
; Kaskadenschatten kosteten 19,9 von 36,2 ms je Bild, weil jede der vier
; Kaskaden die ganze Stadt neu rasterte. Mit VSM: 1,2 ms, Bild 19,3 ms
; (gemessen am 11.09.2026 mit ProfileGPU im Fahrtest, 1600x900).
r.Shadow.Virtual.Enable=1
r.DefaultFeature.MotionBlur=False

