[/Script/Engine.RendererSettings]
; Claude: von den City-Sample-Fahrzeugen verlangt (siehe Fab-Warnung
; "CitySampleVehicleGuideline_VT" fehlende Projekteinstellungen) - ohne diese
; Einstellung behandelte die Engine ihre virtuellen Texturen bei jedem
; Programmstart neu als nicht fertig gebaut und baute Meshes/Texturen jedes
; Mal komplett neu (mehrere Minuten Wartezeit je Testlauf).
r.VirtualTextures=True
; Claude: urspruenglich aus, weil die Stadt als ProceduralMesh ohne Mesh-
; Distanzfelder entstand - Lumen hatte nichts zum Verfolgen. Seit die Stadt
; aus echten Nanite-StaticMeshes besteht (siehe VSM-Kommentar unten), braucht
; Nanite-Geometrie dafuer keine klassischen Distanzfelder mehr (Lumen liest
; Nanite direkt ueber den Surface Cache) - per -LaLaBergFoto (4 Ansichten,
; 14.09.2026) bestaetigt: saubere Beleuchtung, keine Abrisse. Nur die
; ProceduralMeshComponents (Spielfigur, Passanten, Kasten-Fallback-Autos)
; liefern weiterhin keine Distanzfelder und tragen selbst nichts zur
; Verschattung bei - ein kleinerer, bekannter Kompromiss.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=False
; Virtuelle Schattenkarten. Solange die Stadt als ProceduralMesh entstand,
; legten sie die ganze Szene in den Schatten und waren deshalb aus. Seit die
; Stadt aus Nanite-Assets kommt, stimmt das Licht damit wieder - und die
; Kaskadenschatten kosteten 19,9 von 36,2 ms je Bild, weil jede der vier
; Kaskaden die ganze Stadt neu rasterte. Mit VSM: 1,2 ms, Bild 19,3 ms
; (gemessen am 11.09.2026 mit ProfileGPU im Fahrtest, 1600x900).
r.Shadow.Virtual.Enable=1
r.DefaultFeature.MotionBlur=False

