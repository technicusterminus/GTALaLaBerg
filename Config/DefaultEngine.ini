; Kraftbasierte statt constraintbasierte Chaos-Federung. Mit der Vorgabe
; (Constraint) blieb die Federung des Wagens voll eingefedert (Federweg 0.00
; an allen Raedern), die unsichtbare Rumpf-Kollisionsbox lag 3 cm in der
; Fahrbahn und der Wagen rutschte wie ein Schlitten - erst 12000 N Schub
; bewegten ihn. Deshalb brauchte der Antrieb frueher das Hundertfache des
; realen Drehmoments. Gemessen mit -LaLaBergAntriebTest (2026-09-21).
p.Vehicle.DisableConstraintSuspension=1
