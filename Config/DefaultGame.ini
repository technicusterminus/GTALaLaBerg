[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=GTALaLaBerg
Description=Native Unreal integration prototype for GTA LaLaBerg
ProjectVersion=0.1.0

; Das Spiel laedt Stadt, Materialien und einige Engine-Assets zur Laufzeit
; ueber ihren Pfad. Auf solche Assets zeigt keine Karte, deshalb wuerde der
; Cooker sie weglassen - das gepackte Spiel stuende dann in einer leeren Welt.
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
IncludeDebugFiles=False
IncludePrerequisites=True
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+DirectoriesToAlwaysCook=(Path="/Game/City")
+DirectoriesToAlwaysCook=(Path="/Game/Art")
+DirectoriesToAlwaysCook=(Path="/Engine/MapTemplates/Sky")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineFonts")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; Ebenfalls nur per Pfad geladen (beim ersten gepackten Test 2026-09-22 gefunden):
; Motor-, Schritt- und Waffenklaenge, das Ersatzmaterial der Stadt und die
; City-Sample-Fahrzeuge. Von denen nur die Mesh-Ordner der 13 verwendeten Typen
; (LaLaBergWagenTypen) - der ganze Ordner hat 7,2 GB; Materialien und Texturen
; kommen als Abhaengigkeit der Meshes von selbst mit.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineDebugMaterials")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle01_Van/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle02_Car/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle03_Car/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle04_Truck/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle05_Car/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle06_Car/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle07_Car/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle08_Truck/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle09_Van/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle10_Bus/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle11_Truck/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle12_Car/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/CitySampleVehicles/vehicle13_Car/Mesh")
; Das Sektoren-Manifest ist eine JSON-Datei, kein Asset: sie muss als Datei
; mit ins Paket, sonst findet der Lader keine Stadt.
+DirectoriesToAlwaysStageAsUFS=(Path="SourceData/Sectors")
; Strassen-, Platz- und Ortsnamen fuer die Ortsanzeige
+DirectoriesToAlwaysStageAsUFS=(Path="SourceData/Orte")
; Form des fahrbaren Wagens
+DirectoriesToAlwaysStageAsUFS=(Path="SourceData/Fahrzeug")
; Wegpunkte fuer KI-Verkehr und Passanten
+DirectoriesToAlwaysStageAsUFS=(Path="SourceData/Verkehr")
; Stadtplan fuer Minikarte und Vollkarte (Tools/Export/prepare-karte.py)
+DirectoriesToAlwaysStageAsUFS=(Path="SourceData/Karte")
